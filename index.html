<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scientific Calculator</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <div class="calculator-container">

        <div class="calculator">

            <!-- Header -->
            <div class="calculator-header">
                <div>
                    <h2>SCIENTIFIC</h2>
                    <p>Advanced Calculator</p>
                </div>

                <div class="header-icon">🧮</div>
            </div>

            <!-- Display -->
            <div class="display-container">

                <div class="display-top">
                    <span id="mode">DEG</span>
                    <span id="history-count">Ready</span>
                </div>

                <div id="previous-operand"></div>

                <input
                    type="text"
                    id="display"
                    placeholder="0"
                    value="0"
                    readonly
                >

            </div>

            <!-- Calculator Buttons -->
            <div class="buttons">

                <!-- First Row -->
                <button class="function" data-action="clear">AC</button>
                <button class="function" data-action="delete">DEL</button>
                <button class="function" data-value="(">(</button>
                <button class="function" data-value=")">)</button>
                <button class="operator" data-value="/">÷</button>

                <!-- Second Row -->
                <button class="function" data-value="sin(">sin</button>
                <button class="function" data-value="cos(">cos</button>
                <button class="function" data-value="tan(">tan</button>
                <button class="function" data-value="sqrt(">√</button>
                <button class="operator" data-value="*">×</button>

                <!-- Third Row -->
                <button class="function" data-value="log(">log</button>
                <button class="function" data-value="ln(">ln</button>
                <button class="function" data-value="^2">x²</button>
                <button class="function" data-value="^">xʸ</button>
                <button class="operator" data-value="-">−</button>

                <!-- Fourth Row -->
                <button class="function" data-value="π">π</button>
                <button class="function" data-value="e">e</button>
                <button class="function" data-value="!">x!</button>
                <button class="function" data-value="%">%</button>
                <button class="operator" data-value="+">+</button>

                <!-- Fifth Row -->
                <button data-value="7">7</button>
                <button data-value="8">8</button>
                <button data-value="9">9</button>
                <button class="function" data-action="toggle-sign">±</button>
                <button class="function" data-action="toggle-mode" id="mode-button">RAD</button>

                <!-- Sixth Row -->
                <button data-value="4">4</button>
                <button data-value="5">5</button>
                <button data-value="6">6</button>
                <button data-value=".">.</button>
                <button class="operator" data-value="/">÷</button>

                <!-- Seventh Row -->
                <button data-value="1">1</button>
                <button data-value="2">2</button>
                <button data-value="3">3</button>
                <button class="function" data-value="ANS">ANS</button>
                <button class="operator" data-value="*">×</button>

                <!-- Eighth Row -->
                <button class="zero" data-value="0">0</button>
                <button data-action="history" class="function">HIS</button>
                <button class="equals" data-action="calculate">=</button>

            </div>

            <!-- History -->
            <div class="history-container" id="history-container">

                <div class="history-header">
                    <h3>Calculation History</h3>
                    <button id="clear-history">Clear</button>
                </div>

                <div id="history-list">
                    <p class="empty-history">No calculations yet.</p>
                </div>

            </div>

            <!-- Footer -->
            <div class="calculator-footer">
                <span>POWERED BY MUTAHAALI</span>
                <span>SCIENTIFIC CALCULATOR © 2026</span>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
